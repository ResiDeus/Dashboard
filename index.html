<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BoricuaPlayer 2000 • Radio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&display=swap');

    :root {
      --win-purple: #6b5b95;
      --win-pink: #ff6b9d;
      --win-orange: #ff9f43;
      --win-teal: #00cec9;
      --win-yellow: #ffeaa7;
      --win-blue: #74b9ff;
      --dark: #2d3436;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'VT323', monospace;
      background: linear-gradient(135deg, #a29bfe 0%, #fd79a8 40%, #81ecec 100%);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Desktop grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255,255,255,0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.15) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* Main Window */
    .window {
      width: min(94vw, 420px);
      background: #c8c8c8;
      border: 3px solid #fff;
      border-right-color: #555;
      border-bottom-color: #555;
      border-radius: 12px 12px 8px 8px;
      box-shadow: 
        4px 4px 0 #333,
        8px 8px 20px rgba(0,0,0,0.3);
      position: relative;
      z-index: 10;
      overflow: hidden;
    }

    /* Title bar */
    .title-bar {
      background: linear-gradient(90deg, #6b5b95, #a29bfe);
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: white;
      font-size: 1.3rem;
      font-weight: bold;
      border-bottom: 3px solid #fff;
      user-select: none;
    }

    .title-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .title-icon {
      font-size: 1.4rem;
    }

    .window-controls {
      display: flex;
      gap: 6px;
    }

    .win-btn {
      width: 22px;
      height: 22px;
      border: 2px solid #fff;
      border-right-color: #333;
      border-bottom-color: #333;
      background: #ddd;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #333;
      font-weight: bold;
    }

    .win-btn.close {
      background: #ff6b6b;
      color: white;
    }

    /* Content */
    .window-content {
      background: linear-gradient(180deg, #f8e1f4 0%, #e0c3fc 100%);
      padding: 16px;
    }

    /* Now Playing */
    .now-playing-box {
      background: #2d3436;
      border: 3px solid #fff;
      border-right-color: #555;
      border-bottom-color: #555;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 16px;
      color: #00ff9d;
      text-align: center;
    }

    .station-label {
      font-size: 0.95rem;
      color: #ffeaa7;
      margin-bottom: 4px;
    }

    .station-name {
      font-size: 1.7rem;
      color: #00ff9d;
      text-shadow: 0 0 8px #00ff9d;
      margin-bottom: 4px;
    }

    .track-name {
      font-size: 1.15rem;
      color: #74b9ff;
    }

    /* Equalizer */
    .eq-container {
      display: flex;
      justify-content: center;
      gap: 4px;
      height: 50px;
      align-items: flex-end;
      margin: 12px 0;
      background: #1e272e;
      border-radius: 8px;
      padding: 8px;
      border: 2px solid #555;
    }

    .eq-bar {
      width: 12px;
      background: linear-gradient(to top, #ff6b9d, #ffeaa7, #00cec9);
      border-radius: 3px 3px 0 0;
      animation: eqDance 0.4s ease-in-out infinite alternate;
    }

    .eq-bar:nth-child(1) { height: 30%; animation-delay: 0.0s; }
    .eq-bar:nth-child(2) { height: 60%; animation-delay: 0.1s; }
    .eq-bar:nth-child(3) { height: 90%; animation-delay: 0.2s; }
    .eq-bar:nth-child(4) { height: 50%; animation-delay: 0.15s; }
    .eq-bar:nth-child(5) { height: 75%; animation-delay: 0.05s; }
    .eq-bar:nth-child(6) { height: 40%; animation-delay: 0.25s; }
    .eq-bar:nth-child(7) { height: 85%; animation-delay: 0.1s; }
    .eq-bar:nth-child(8) { height: 55%; animation-delay: 0.3s; }
    .eq-bar:nth-child(9) { height: 70%; animation-delay: 0.2s; }
    .eq-bar:nth-child(10){ height: 45%; animation-delay: 0.15s; }

    @keyframes eqDance {
      from { transform: scaleY(0.35); }
      to   { transform: scaleY(1); }
    }

    /* Transport controls */
    .transport {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .ctrl-btn {
      width: 52px;
      height: 52px;
      border: 3px solid #fff;
      border-right-color: #555;
      border-bottom-color: #555;
      border-radius: 12px;
      background: linear-gradient(145deg, #ffeaa7, #fdcb6e);
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 2px 2px 0 #333;
      transition: all 0.1s;
    }

    .ctrl-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 #333;
    }

    .ctrl-btn.play {
      background: linear-gradient(145deg, #55efc4, #00b894);
      width: 64px;
      height: 64px;
      font-size: 1.8rem;
    }

    .ctrl-btn.power {
      background: linear-gradient(145deg, #ff7675, #d63031);
      color: white;
    }

    /* Presets / Stations */
    .presets-title {
      font-size: 1.2rem;
      color: #2d3436;
      margin-bottom: 8px;
      text-align: center;
    }

    .presets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .preset {
      background: linear-gradient(145deg, #a29bfe, #6c5ce7);
      border: 3px solid #fff;
      border-right-color: #3d3d3d;
      border-bottom-color: #3d3d3d;
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 2px 2px 0 #333;
      transition: all 0.1s;
    }

    .preset:active {
      transform: translate(2px, 2px);
      box-shadow: 0 0 0 #333;
    }

    .preset.active {
      background: linear-gradient(145deg, #ff6b9d, #e84393);
      box-shadow: 0 0 0 3px #ffeaa7, 2px 2px 0 #333;
    }

    /* Volume */
    .volume-box {
      margin-top: 16px;
      background: #dfe6e9;
      border: 3px solid #fff;
      border-right-color: #555;
      border-bottom-color: #555;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .vol-label {
      font-size: 1.2rem;
      color: #2d3436;
      min-width: 40px;
    }

    .vol-slider {
      flex: 1;
      height: 12px;
      -webkit-appearance: none;
      appearance: none;
      background: #636e72;
      border-radius: 6px;
      border: 2px solid #2d3436;
    }

    .vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      background: linear-gradient(145deg, #ffeaa7, #fdcb6e);
      border: 3px solid #2d3436;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 1px 1px 0 #333;
    }

    /* Desktop icons (decorative) */
    .desktop-icons {
      position: fixed;
      top: 20px;
      left: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      z-index: 5;
    }

    .desk-icon {
      text-align: center;
      color: white;
      font-size: 0.9rem;
      text-shadow: 1px 1px 2px #000;
      cursor: default;
    }

    .desk-icon span {
      font-size: 2.2rem;
      display: block;
      margin-bottom: 2px;
      filter: drop-shadow(2px 2px 0 #333);
    }

    /* Footer */
    .footer {
      margin-top: 20px;
      text-align: center;
      color: white;
      font-size: 1.1rem;
      text-shadow: 1px 1px 3px #000;
      z-index: 10;
    }

    .footer span {
      color: #ffeaa7;
    }

    /* Responsive */
    @media (max-width: 420px) {
      .desktop-icons { display: none; }
      .ctrl-btn { width: 46px; height: 46px; }
      .ctrl-btn.play { width: 56px; height: 56px; }
    }
  </style>
</head>
<body>

  <!-- Decorative desktop icons -->
  <div class="desktop-icons">
    <div class="desk-icon">
      <span>💻</span>
      My Computer
    </div>
    <div class="desk-icon">
      <span>📁</span>
      Radio PR
    </div>
    <div class="desk-icon">
      <span>🎵</span>
      Playlist
    </div>
    <div class="desk-icon">
      <span>🌐</span>
      Internet
    </div>
  </div>

  <!-- Main Radio Window -->
  <div class="window">
    <div class="title-bar">
      <div class="title-bar-left">
        <span class="title-icon">📻</span>
        <span>BoricuaPlayer 2000</span>
      </div>
      <div class="window-controls">
        <div class="win-btn">_</div>
        <div class="win-btn">□</div>
        <div class="win-btn close">×</div>
      </div>
    </div>

    <div class="window-content">
      <!-- Now Playing -->
      <div class="now-playing-box">
        <div class="station-label">AHORA SUENA EN SAN JUAN</div>
        <div class="station-name" id="stationName">SALSA GORDA FM</div>
        <div class="track-name" id="trackName">Héctor Lavoe • El Cantante</div>

        <!-- Equalizer -->
        <div class="eq-container" id="eq">
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
          <div class="eq-bar"></div>
        </div>
      </div>

      <!-- Transport -->
      <div class="transport">
        <button class="ctrl-btn power" onclick="togglePower()">⏻</button>
        <button class="ctrl-btn" onclick="prevStation()">⏮</button>
        <button class="ctrl-btn play" id="playBtn" onclick="togglePlay()">▶</button>
        <button class="ctrl-btn" onclick="nextStation()">⏭</button>
      </div>

      <!-- Presets -->
      <div class="presets-title">★ ESTACIONES BORICUAS ★</div>
      <div class="presets" id="presets">
        <div class="preset active" data-station="0">1 • SALSA</div>
        <div class="preset" data-station="1">2 • REGGAETON</div>
        <div class="preset" data-station="2">3 • MERENGUE</div>
        <div class="preset" data-station="3">4 • BALADAS</div>
        <div class="preset" data-station="4">5 • OLD SCHOOL</div>
        <div class="preset" data-station="5">6 • TRAP PR</div>
      </div>

      <!-- Volume -->
      <div class="volume-box">
        <div class="vol-label">VOL</div>
        <input type="range" class="vol-slider" min="0" max="100" value="80" id="volume">
        <div class="vol-label" id="volValue">80</div>
      </div>
    </div>
  </div>

  <div class="footer">
    Hecho con <span>♥</span> pa’ la gente boricua • <span>¡Wepa 2000!</span>
  </div>

  <script>
    const stations = [
      { name: "SALSA GORDA FM", track: "Héctor Lavoe • El Cantante" },
      { name: "REGGAETON 24/7", track: "Daddy Yankee • Gasolina" },
      { name: "MERENGUE POWER", track: "Elvis Crespo • Suavemente" },
      { name: "BALADAS DEL CORAZÓN", track: "José José • El Triste" },
      { name: "OLD SCHOOL PR", track: "Vico C • Explosión" },
      { name: "TRAP BORICUA", track: "Bad Bunny • Tití Me Preguntó" }
    ];

    let current = 0;
    let isPlaying = true;
    let powerOn = true;

    const stationNameEl = document.getElementById('stationName');
    const trackNameEl = document.getElementById('trackName');
    const playBtn = document.getElementById('playBtn');
    const presets = document.querySelectorAll('.preset');
    const volSlider = document.getElementById('volume');
    const volValue = document.getElementById('volValue');
    const eq = document.getElementById('eq');

    function updateUI() {
      stationNameEl.textContent = stations[current].name;
      trackNameEl.textContent = stations[current].track;
      presets.forEach((p, i) => p.classList.toggle('active', i === current));
    }

    function togglePlay() {
      if (!powerOn) return;
      isPlaying = !isPlaying;
      playBtn.textContent = isPlaying ? "⏸" : "▶";
      eq.style.opacity = isPlaying ? "1" : "0.35";
    }

    function togglePower() {
      powerOn = !powerOn;
      const box = document.querySelector('.now-playing-box');
      if (powerOn) {
        box.style.opacity = "1";
        updateUI();
        isPlaying = true;
        playBtn.textContent = "⏸";
        eq.style.opacity = "1";
      } else {
        box.style.opacity = "0.4";
        stationNameEl.textContent = "SISTEMA APAGADO";
        trackNameEl.textContent = "— — —";
        playBtn.textContent = "▶";
        isPlaying = false;
        eq.style.opacity = "0.2";
      }
    }

    function nextStation() {
      if (!powerOn) return;
      current = (current + 1) % stations.length;
      updateUI();
    }

    function prevStation() {
      if (!powerOn) return;
      current = (current - 1 + stations.length) % stations.length;
      updateUI();
    }

    presets.forEach(p => {
      p.addEventListener('click', () => {
        if (!powerOn) return;
        current = parseInt(p.dataset.station);
        updateUI();
      });
    });

    volSlider.addEventListener('input', () => {
      volValue.textContent = volSlider.value;
    });

    // Start
    updateUI();
  </script>
</body>
</html>
